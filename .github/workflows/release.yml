# 发布流水线：打 tag（v*）或手动触发时校验并发布到 npm。
#
# 需要仓库 secret `NPM_TOKEN`（npm Automation token，Bypass 2FA）。没配这个 secret 时，
# 校验步骤照跑，发布步骤自动跳过，所以打 tag 不会产生失败的红叉。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Verify (typecheck + build + specs)
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
