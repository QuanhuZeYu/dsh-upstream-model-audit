# 发布流水线：打 tag（v*）或手动触发时校验并发布到 npm。
#
# 两个校验 job：
#   - verify：装依赖、构建、跑 38 条规格（不依赖任何外部仓库）；
#   - typecheck：clone 官方 DeepSeek Harness、按官方顺序构建类型环境（build:lib:host +
#     tsc -b tsconfig.client.json），再用插件自己的 tsconfig 类型检查。lib/types 与 /remote
#     子路径类型都不入库，必须重建；实测约 3 分钟。
#     publish 只依赖 verify：类型检查红是明确信号，但上游 master 漂移不该卡住已经验证过的发布。
#
# 需要仓库 secret `NPM_TOKEN`（npm Automation token，Bypass 2FA）。没配时发布步骤自动跳过。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Specs
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone DeepSeek Harness (type source)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git /home/runner/deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Harness dependencies
        working-directory: /home/runner/deepseek-harness
        run: pnpm install --frozen-lockfile --ignore-scripts
      # 两个坑：只构建"本插件用到的那几个包"不行，client 面的包互相引用 /remote 子路径类型；
      # 而只用 tsc -b 建 host 面也不够，官方 typecheck 的前置是 build:lib:host（含 tsdown 那一半）。
      - name: Build Harness host face (official command)
        working-directory: /home/runner/deepseek-harness
        run: pnpm run build:lib:host
      - name: Build Harness client face types (official command)
        working-directory: /home/runner/deepseek-harness
        run: pnpm exec tsc -b tsconfig.client.json
      - name: Typecheck plugin against Harness types
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json --noEmit

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      # secrets 不能出现在 step 的 if 里，先映射成普通变量再判断。
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
